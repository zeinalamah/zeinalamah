name: Temporary Paper 2 V7 public data build

on:
  push:
    branches: [main]
    paths:
      - 'temporary_research/**'
      - '.github/workflows/temporary-paper2-v7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'temporary_research/**'
      - '.github/workflows/temporary-paper2-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pandas numpy requests searoute
      - run: python temporary_research/collect_portwatch_delivery.py
      - if: always()
        run: |
          cat research_output/paper2_v7/port_delivery_extension_summary.json || true
          find research_output/paper2_v7 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-v7-port-delivery-extension
          path: research_output/paper2_v7
          if-no-files-found: error
          retention-days: 7
