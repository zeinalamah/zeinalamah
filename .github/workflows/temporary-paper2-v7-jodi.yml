name: Temporary Paper 2 V7 JODI build
on:
  push:
    branches: [main]
    paths:
      - 'temporary_research/collect_jodi_gulf_exports.py'
      - '.github/workflows/temporary-paper2-v7-jodi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'temporary_research/collect_jodi_gulf_exports.py'
      - '.github/workflows/temporary-paper2-v7-jodi.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pandas requests
      - run: python temporary_research/collect_jodi_gulf_exports.py
      - if: always()
        run: cat research_output/paper2_v7_jodi/jodi_summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-v7-jodi-gulf-exports
          path: research_output/paper2_v7_jodi
          if-no-files-found: error
          retention-days: 7
