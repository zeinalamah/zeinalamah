name: Execute broad energy-intensive panel

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/energy-intensive-execution.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: [2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests py7zr pyarrow
      - name: Fetch immutable collector
        run: curl -L --fail -o collect.py https://raw.githubusercontent.com/zeinalamah/newproj_command/bdbe7fce688ecd9428e8af6b438bff769dc8d389/paper2/collect_energy_intensive_year.py
      - run: python collect.py --year ${{ matrix.year }} --out-dir research_output/energy_intensive/year_${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-intensive-${{ matrix.year }}
          path: research_output/energy_intensive/year_${{ matrix.year }}
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy pyarrow
      - name: Fetch immutable combiner
        run: curl -L --fail -o combine.py https://raw.githubusercontent.com/zeinalamah/newproj_command/bdbe7fce688ecd9428e8af6b438bff769dc8d389/paper2/combine_energy_intensive_years.py
      - uses: actions/download-artifact@v4
        with:
          pattern: energy-intensive-*
          path: research_output/energy_intensive
          merge-multiple: false
      - name: Normalize directories
        run: |
          for y in $(seq 2015 2026); do
            src="research_output/energy_intensive/energy-intensive-$y"
            dst="research_output/energy_intensive/year_$y"
            if [ -d "$src" ]; then mv "$src" "$dst"; fi
          done
      - run: python combine.py
      - run: cat research_output/energy_intensive/build_summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-intensive-broad-panel-2015-2026
          path: research_output/energy_intensive
          if-no-files-found: error
          retention-days: 7
